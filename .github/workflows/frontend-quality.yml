name: Frontend Quality

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Biome and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Sem `version:` de proposito: a action le a versao do campo
      # packageManager do package.json, que e a unica fonte da verdade.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm 11 tem um bug (pnpm/pnpm#12469) que reescreve o allowBuilds em
      # pnpm-workspace.yaml trocando `true` por um placeholder, o que faz o
      # esbuild nao ser buildado e o install falhar silenciosamente. Este guard
      # falha o CI de forma clara se isso acontecer, em vez de deixar passar.
      - name: Verify build-scripts config was honored
        run: |
          if grep -q "set this to true or false" pnpm-workspace.yaml; then
            echo "::error file=pnpm-workspace.yaml::pnpm reescreveu allowBuilds com um placeholder. Restaure 'esbuild: true' e commite o arquivo."
            exit 1
          fi
          if [ ! -x node_modules/.pnpm/esbuild@*/node_modules/esbuild/bin/esbuild ]; then
            echo "::error::O binario do esbuild nao foi construido. Verifique allowBuilds em pnpm-workspace.yaml."
            exit 1
          fi

      - name: Check formatting and linting
        run: pnpm check

      - name: Check TypeScript types
        run: pnpm typecheck

      - name: Check design tokens
        run: pnpm check:tokens

      - name: Check modal store
        run: pnpm check:modal
